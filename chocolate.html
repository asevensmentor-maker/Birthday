<!DOCTYPE html>
<html>
<head>
    <title>For You 🍫💖</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Tap Me 🍫❤️</h1>
    <p>Every touch = chocolate for you 💖</p>
    <img id="avatar" src="standing.png" width="220" onclick="giveChocolate()">
    <p id="msg"></p>
    <button id="nextBtn" class="btn" data-link="memories.html" style="display:none;">
        See Our Memories 💖
    </button>
</div>

<script src="script.js"></script>
<script>
const messages = [
    "You are my sweetest chocolate 😍",
    "I love you more than chocolate 🍫❤️",
    "You are my happiness 🥺",
    "You make my life beautiful 💖",
    "You are my favorite person ❤️"
];

function giveChocolate() {
    const avatar = document.getElementById("avatar");
    const choco = document.createElement("img");

    avatar.src = "give-chocolate.png";
    choco.src = "chocolate.png";
    choco.style.position = "absolute";
    choco.style.width = "80px";
    choco.style.left = Math.random() * 80 + "%";
    choco.style.top = "60%";

    document.body.appendChild(choco);
    setTimeout(() => choco.remove(), 2000);
    setTimeout(() => avatar.src = "standing.png", 800);

    document.getElementById("msg").innerText =
        messages[Math.floor(Math.random() * messages.length)];

    document.getElementById("nextBtn").style.display = "inline-block";
}
</script>
</body>
</html>
