<!DOCTYPE html>
<html>
<head>
<title>For You 🍫💖</title>

<style>
body {
  margin:0;
  background: linear-gradient(to bottom, #3e2723, #1b0f0a);
  color:white;
  text-align:center;
  font-family: Arial;
  overflow:hidden;
}

/* AVATAR */
#avatar {
  width:200px;
  margin-top:50px;
  cursor:pointer;
  transition: transform 0.2s;
}

#avatar:active {
  transform: scale(1.1);
}

/* CHOCOLATE POP */
.chocolate {
  position:absolute;
  font-size:30px;
  animation: pop 2s ease forwards;
}

@keyframes pop {
  0% { transform: scale(0) translateY(0); opacity:1; }
  100% { transform: scale(1.5) translateY(-150px); opacity:0; }
}

/* MESSAGE */
#msg {
  margin-top:20px;
  font-size:20px;
}
</style>

</head>

<body>

<h1>Tap Me 🍫❤️</h1>
<p>Every touch = one chocolate for you 💖</p>

<img id="avatar" src="avatar.png" onclick="giveChocolate()">

<p id="msg"></p>

<script>

const chocolates = ["🍫","🍩","🍰","🍪","🍬"];

const messages = [
  "You are my sweetest chocolate 😍",
  "Every moment with you is sweet 💖",
  "I love you more than chocolate 🍫❤️",
  "You are my happiness 🥺",
  "You are my favorite person 💕"
];

function giveChocolate(){

  // random chocolate
  const choco = document.createElement("div");
  choco.classList.add("chocolate");
  choco.innerHTML = chocolates[Math.floor(Math.random()*chocolates.length)];

  // random position
  choco.style.left = Math.random()*80 + "%";
  choco.style.top = "60%";

  document.body.appendChild(choco);

  // remove after animation
  setTimeout(()=>choco.remove(),2000);

  // random message
  document.getElementById("msg").innerText =
    messages[Math.floor(Math.random()*messages.length)];
}

</script>

</body>
</html>
