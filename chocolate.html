<!DOCTYPE html>
<html>
<head>
<title>For You 🍫💖</title>

<style>
body {
  margin:0;
  background: linear-gradient(to bottom, #3e2723, #1b0f0a);
  color:white;
  text-align:center;
  font-family: Arial;
  overflow:hidden;
}

/* AVATAR */
#avatar {
  width:220px;
  margin-top:50px;
  cursor:pointer;
  transition: transform 0.2s;
}

#avatar:active {
  transform: scale(1.05);
}

/* CHOCOLATE IMAGE */
.choco {
  position:absolute;
  width:80px;
  animation: pop 2s ease forwards;
}

@keyframes pop {
  0% { transform: scale(0) translateY(0); opacity:1; }
  100% { transform: scale(1.2) translateY(-200px); opacity:0; }
}

/* MESSAGE */
#msg {
  margin-top:20px;
  font-size:20px;
}
</style>

</head>

<body>

<h1>Tap Me 🍫❤️</h1>
<p>Every touch = chocolate for you 💖</p>

<!-- AVATAR -->
<img id="avatar" src="standing.png" onclick="giveChocolate()">

<p id="msg"></p>

<script>

const messages = [
  "You are my sweetest chocolate 😍",
  "I love you more than chocolate 🍫❤️",
  "You are my happiness 🥺",
  "You make my life beautiful 💖",
  "You are my favorite person ❤️"
];

function giveChocolate(){

  const avatar = document.getElementById("avatar");

  // CHANGE AVATAR (GIVING)
  avatar.src = "give-chocolate.png";

  // CREATE REAL CHOCOLATE IMAGE
  const choco = document.createElement("img");
  choco.src = "chocolate.png";  // your Dairy Milk image
  choco.classList.add("choco");

  choco.style.left = Math.random()*80 + "%";
  choco.style.top = "60%";

  document.body.appendChild(choco);

  // REMOVE AFTER ANIMATION
  setTimeout(()=>choco.remove(),2000);

  // CHANGE BACK TO NORMAL
  setTimeout(()=>{
    avatar.src = "standing.png";
  },800);

  // SHOW MESSAGE
  document.getElementById("msg").innerText =
    messages[Math.floor(Math.random()*messages.length)];
}

</script>
<button onclick="window.location.href='memories.html'">
  See Our Memories 💖
</button>
</body>
</html>
