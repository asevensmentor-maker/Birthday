<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Our Memories ❤️</title>

<style>
body {
  margin:0;
  background: linear-gradient(to bottom, #ffe4ec, #ffc1cc);
  font-family: 'Poppins', sans-serif;
  text-align:center;
  color:#333;
}

/* IMAGE */
#photo {
  width:250px;
  margin-top:50px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  transition: opacity 1s;
}

/* TEXT */
#message {
  margin-top:20px;
  font-size:20px;
  max-width:500px;
  margin-left:auto;
  margin-right:auto;
  min-height:60px;
}

/* FADE */
.fade {
  opacity:0;
}
</style>

</head>

<body>
  
<script src="script.js"></script>
<h1>💖 Our Beautiful Memories 💖</h1>

<img id="photo" src="photo1.jpg">

<p id="message"></p>

<script>

const photos = [
  "photo1.jpg",  // where I met you
  "photo2.jpg",  // we became close
  "photo3.jpg",  // childhood innocence
  "photo4.jpg"   // beautiful & strong
];

const messages = [
  "This is where I met you ❤️ This is where I got to know what a truly innocent soul you are… and how beautiful one person can be 💖",
  
  "This is where we became close ❤️ The best moment of my life… and I promise to stay here in the future too, just like this 🥺",
  
  "This image always reminds me of the innocent child inside you ❤️ The one I always want to protect and keep alive forever 💕",
  
  "This image shows how beautiful and strong you are ❤️ No matter what happens, you still stand there smiling… and that makes you even more special to me 💖"
];

let index = 0;

/* TYPE TEXT */
function typeText(text){
  const msg = document.getElementById("message");
  msg.innerHTML = "";
  let i = 0;

  function typing(){
    if(i < text.length){
      msg.innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, 40);
    }
  }

  typing();
}

/* SHOW NEXT */
function nextSlide(){

  const img = document.getElementById("photo");

  img.style.opacity = 0;

  setTimeout(()=>{

    index++;

    if(index >= photos.length){
      showFinal();
      return;
    }

    img.src = photos[index];
    img.style.opacity = 1;
    img.classList.add("zoom");

    typeText(messages[index]);

  },1500);
}

/* HEARTS */
setInterval(()=>{
  const heart = document.createElement("span");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100+"vw";
  document.getElementById("hearts").appendChild(heart);

  setTimeout(()=>heart.remove(),6000);
},400);

/* INITIAL */
typeText(messages[0]);

setInterval(nextSlide, 6000);

/* FINAL SCREEN */
function showFinal() {
  document.body.innerHTML = `
    <div style="margin-top:150px; text-align:center;">
      <h1>❤️ Best Memories With You ❤️</h1>
      <p style="font-size:24px;">
        Every moment with you is my favorite memory 💖<br><br>
        I love you forever ❤️
      </p>

      <br><br>

      <button class="btn" onclick="goFinal()">
        Final Surprise 🎂
      </button>
    </div>
  `;
}

function goFinal() {
  window.location.href = "final.html";
}
  

</script>

</body>
</html>
