<!DOCTYPE html>
<html>
<head>
    <title>Our Memories ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>💖 Our Beautiful Memories 💖</h1>
    <img id="photo" src="photo1.jpg" width="250">
    <p id="message"></p>
</div>

<script src="script.js"></script>
<script>
const photos = ["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg"];
const messages = [
   "This is where I met you ❤️ This is where I got to know what a truly innocent soul you are… and how beautiful one person can be 💖",
    "This image always reminds me of the innocent child inside you ❤️ The one I always want to protect and keep alive forever 💕",
    "This was our first trip together ❤️ The day you met my parents and came to my home meant the world to me. You saw my favorite beaches and my favorite places. On that day, I fulfilled my promise to you and created countless unforgettable memories. And I promise to keep creating many more with you forever. 🥺💞",
    "This image shows how beautiful and strong you are ❤️ No matter what happens, you still stand there smiling… and that makes you even more special to me 💖"
];

let index = 0;

function typeText(text) {
    const msg = document.getElementById("message");
    msg.innerHTML = "";
    let i = 0;
    function typing() {
        if (i < text.length) {
            msg.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 40);
        }
    }
    typing();
}

function nextSlide() {
    index++;
    if (index >= photos.length) {
        window.location.href = "final.html";
        return;
    }
    document.getElementById("photo").src = photos[index];
    typeText(messages[index]);
}

typeText(messages[0]);
setInterval(nextSlide, 5000);
</script>
</body>
</html>
