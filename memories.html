<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Memories ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Global Styles -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            background: linear-gradient(to bottom, #ffe4ec, #ffc1cc);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: #333;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 20px;
        }

        /* Image */
        #photo {
            width: 250px;
            margin-top: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: opacity 1s ease-in-out, transform 1s;
        }

        /* Text */
        #message {
            margin-top: 20px;
            font-size: 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            min-height: 60px;
            padding: 0 15px;
        }

        /* Heart Container */
        #hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        #hearts span {
            position: absolute;
            color: red;
            font-size: 20px;
            animation: floatUp 6s linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(100vh);
                opacity: 1;
            }
            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        .final-screen {
            margin-top: 120px;
            padding: 20px;
        }

        .btn {
            padding: 14px 28px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #ff4d6d, #ff758c);
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            #photo {
                width: 80%;
            }

            #message {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Heart Rain -->
    <div id="hearts"></div>

    <h1>💖 Our Beautiful Memories 💖</h1>

    <img id="photo" src="photo1.jpg" alt="Memory Photo">

    <p id="message"></p>

    <!-- Global Script -->
    <script src="script.js"></script>

    <script>
        const photos = [
            "photo1.jpg",
            "photo2.jpg",
            "photo3.jpg",
            "photo4.jpg"
        ];

        const messages = [
            "This is where I met you ❤️ This is where I got to know what a truly innocent soul you are… and how beautiful one person can be 💖",
            "This is where we became close ❤️ The best moment of my life… and I promise to stay here in the future too, just like this 🥺",
            "This image always reminds me of the innocent child inside you ❤️ The one I always want to protect and keep alive forever 💕",
            "This image shows how beautiful and strong you are ❤️ No matter what happens, you still stand there smiling… and that makes you even more special to me 💖"
        ];

        let index = 0;

        function typeText(text) {
            const msg = document.getElementById("message");
            msg.innerHTML = "";
            let i = 0;

            function typing() {
                if (i < text.length) {
                    msg.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, 40);
                }
            }
            typing();
        }

        function nextSlide() {
            const img = document.getElementById("photo");
            img.style.opacity = 0;

            setTimeout(() => {
                index++;

                if (index >= photos.length) {
                    showFinal();
                    return;
                }

                img.src = photos[index];
                img.style.opacity = 1;
                typeText(messages[index]);
            }, 1000);
        }

        /* Heart Animation */
        setInterval(() => {
            const heart = document.createElement("span");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            document.getElementById("hearts").appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 400);

        typeText(messages[0]);
        setInterval(nextSlide, 6000);

        /* Final Screen */
        function showFinal() {
            document.body.innerHTML = `
                <div class="final-screen">
                    <h1>❤️ Best Memories With You ❤️</h1>
                    <p style="font-size:22px;">
                        Every moment with you is my favorite memory 💖<br><br>
                        I love you forever ❤️
                    </p>
                    <br><br>
                    <a href="final.html">
                        <button class="btn">Final Surprise 🎂</button>
                    </a>
                </div>
            `;
        }
    </script>

</body>
</html>
