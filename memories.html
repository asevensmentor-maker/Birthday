<!DOCTYPE html>
<html>
<head>
    <title>Our Memories ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>💖 Our Beautiful Memories 💖</h1>
    <img id="photo" src="photo1.jpg" width="250">
    <p id="message"></p>
</div>

<script src="script.js"></script>
<script>
const photos = ["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg"];
const messages = [
    "This is where I met you ❤️",
    "This is where we became close ❤️",
    "Your innocence makes you special 💕",
    "You are beautiful and strong 💖"
];

let index = 0;

function typeText(text) {
    const msg = document.getElementById("message");
    msg.innerHTML = "";
    let i = 0;
    function typing() {
        if (i < text.length) {
            msg.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 40);
        }
    }
    typing();
}

function nextSlide() {
    index++;
    if (index >= photos.length) {
        window.location.href = "final.html";
        return;
    }
    document.getElementById("photo").src = photos[index];
    typeText(messages[index]);
}

typeText(messages[0]);
setInterval(nextSlide, 5000);
</script>
</body>
</html>
