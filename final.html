<!DOCTYPE html>
<html>
<head>
    <title>Final Birthday Surprise 🎂</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin-top: 20px;
            font-size: 24px;
        }

        .scene {
            position: relative;
            height: 75vh;
        }

        /* Avatar Styling */
        .avatar {
            position: absolute;
            bottom: 0;
            width: 110px;
        }

        #hero {
            left: -150px;
            bottom: 0;
        }

        #danceAvatar {
            left: 10%;
            width: 90px;
            display: none;
            animation: dance 0.6s infinite alternate;
        }

        #stitch {
            right: 10%;
            width: 90px;
            display: none;
            animation: dance 0.6s infinite alternate;
        }

        #gf {
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            display: none;
        }

        /* Cake */
        #cakeContainer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 120px;
            display: none;
        }

        #cake {
            width: 170px;
            transition: transform 0.5s ease;
        }

        #cake.slice {
            transform: rotate(-10deg) scale(0.9);
        }

        #candle {
            font-size: 26px;
            margin-bottom: -20px;
        }

        /* Buttons */
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            background: white;
            color: #ff4f81;
            font-size: 14px;
            margin: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #ffe6ec;
        }

        #wishBox {
            display: none;
        }

        input {
            padding: 10px;
            border-radius: 20px;
            border: none;
            width: 220px;
            text-align: center;
        }

        /* Animations */
        @keyframes dance {
            from { transform: translateY(0) rotate(-5deg); }
            to { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes walkCenter {
            to { left: 50%; transform: translateX(-50%); }
        }

        .walk {
            animation: walkCenter 3s forwards;
        }

        /* Hearts */
        .heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp 3s linear forwards;
        }

        @keyframes floatUp {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-200px); opacity: 0; }
        }
    </style>
</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️ 🎉</h1>

<div class="scene">

    <!-- Your Avatar with Cake -->
    <img id="hero" src="hero-cake.png" class="avatar">

    <!-- Dancing Avatars -->
    <img id="danceAvatar" src="dance.png" class="avatar">
    <img id="stitch" src="stitch.png" class="avatar">

    <!-- Girlfriend Avatar -->
    <img id="gf" src="gf.png" class="avatar">

    <!-- Cake with Candle -->
    <div id="cakeContainer">
        <div id="candle">🕯️</div>
        <img id="cake" src="cake.png">
    </div>

</div>

<!-- Controls -->
<div id="controls">
    <button id="blowBtn" style="display:none;" onclick="blowCandle()">Blow Candle 🕯️</button>
    <button id="wishBtn" style="display:none;" onclick="showWish()">Make a Wish 💖</button>
    <button id="cutBtn" style="display:none;" onclick="cutCake()">Cut Cake 🎂</button>
</div>

<!-- Wish Input -->
<div id="wishBox">
    <input type="text" id="wishInput" placeholder="Type your wish...">
    <br><br>
    <button onclick="saveWish()">Submit Wish ✨</button>
</div>

<p id="message"></p>

<!-- Music -->
<audio autoplay loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>
    // Step 1: Hero walks to center
    window.onload = function() {
        document.getElementById("hero").classList.add("walk");
    };

    // Step 2: Dancing avatars appear
    setTimeout(() => {
        document.getElementById("danceAvatar").style.display = "block";
        document.getElementById("stitch").style.display = "block";
    }, 3000);

    // Step 3: GF avatar appears
    setTimeout(() => {
        document.getElementById("gf").style.display = "block";
    }, 5000);

    // Step 4: Cake appears
    setTimeout(() => {
        document.getElementById("cakeContainer").style.display = "block";
        document.getElementById("blowBtn").style.display = "inline-block";
    }, 7000);

    function blowCandle() {
        document.getElementById("candle").style.display = "none";
        document.getElementById("blowBtn").style.display = "none";
        document.getElementById("wishBtn").style.display = "inline-block";
    }

    function showWish() {
        document.getElementById("wishBtn").style.display = "none";
        document.getElementById("wishBox").style.display = "block";
    }

    function saveWish() {
        const wish = document.getElementById("wishInput").value;
        document.getElementById("wishBox").style.display = "none";
        document.getElementById("message").innerText =
            "Her Wish: " + wish + " 💖";
        document.getElementById("cutBtn").style.display = "inline-block";
    }

    function cutCake() {
        document.getElementById("cake").classList.add("slice");
        document.getElementById("message").innerText =
            "Happy Birthday My Love ❤️🎂";
        launchHearts();
    }

    function launchHearts() {
        for (let i = 0; i < 40; i++) {
            let heart = document.createElement("div");
            heart.innerHTML = "💖";
            heart.className = "heart";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.bottom = "100px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }
    }
</script>

</body>
</html>
