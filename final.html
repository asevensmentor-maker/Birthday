<!DOCTYPE html>
<html>
<head>
    <title>Final Birthday Surprise 🎂</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎉 Happy Birthday My Love ❤️ 🎉</h1>
    <img src="cake2.png" width="220">
    <p>May your day be filled with love, joy, and happiness! 💖</p>

    <input type="text" id="wish" placeholder="Make a wish..." style="padding:10px;border-radius:20px;border:none;">
    <br><br>
    <button class="btn" onclick="showWish()">Submit Wish ✨</button>
    <p id="output"></p>
</div>

<script src="script.js"></script>
<script>
function showWish() {
    const wish = document.getElementById("wish").value;
    if (wish.trim() === "") {
        alert("Please enter your wish 💖");
        return;
    }
    document.getElementById("output").innerHTML =
        "Her Wish: 💕 " + wish;
}
</script>
</body>
</html>
