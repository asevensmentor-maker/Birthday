<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Birthday Surprise 🎂</title>
<link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    color: white;
    overflow-x: hidden;
}

h1 {
    margin-top: 20px;
    font-size: 32px;
}

/* Scene Layout */
.scene {
    position: relative;
    height: 75vh;
    width: 100%;
}

/* Avatars */
.avatar {
    position: absolute;
    bottom: 0;
    transition: all 1.5s ease-in-out;
}

#hero {
    width: 200px;
    left: -40%;
}

.walk-in {
    left: 10%;
}

#gf {
    width: 320px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
}

/* Cake Container */
#cake-container {
    position: absolute;
    width: 300px;
    height: 300px;
    left: 50%;
    transform: translateX(-50%);
    bottom: 220px;
    display: none;
    cursor: pointer;
}

/* Whole Cake */
.cake-base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url('cake2.png') center/cover no-repeat;
}

/* Candle */
#candle {
    position: absolute;
    top: -45px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 34px;
}

/* Blow Candle Button */
#blowBtn {
    display: none;
    margin-top: 10px;
}

/* Knife */
#knife {
    position: absolute;
    font-size: 50px;
    display: none;
    pointer-events: none;
    transform: rotate(-45deg);
    z-index: 10;
}

/* Cake Slices */
.slice {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url('cake2.png') center/cover no-repeat;
    opacity: 0;
    transition: transform 0.6s ease, opacity 0.6s ease;
}

.slice1 { clip-path: polygon(50% 50%, 50% 0%, 65% 0%, 55% 50%); }
.slice2 { clip-path: polygon(50% 50%, 65% 0%, 100% 50%, 60% 55%); }
.slice3 { clip-path: polygon(50% 50%, 100% 50%, 75% 100%, 55% 60%); }
.slice4 { clip-path: polygon(50% 50%, 75% 100%, 25% 100%, 45% 60%); }
.slice5 { clip-path: polygon(50% 50%, 25% 100%, 0% 50%, 40% 55%); }
.slice6 { clip-path: polygon(50% 50%, 0% 50%, 35% 0%, 45% 50%); }

.slice.cut {
    opacity: 1;
    transform: translate(40px, -40px) rotate(12deg);
}

/* Message */
#message {
    font-size: 22px;
    margin-top: 10px;
}

/* Final Birthday Text */
#finalText {
    display: none;
    font-size: 60px;
    font-weight: bold;
    text-shadow: 0 0 10px #fff,
                 0 0 20px #ff4d6d,
                 0 0 40px #ff4d6d;
    animation: zoomIn 1.5s ease-in-out forwards;
}

@keyframes zoomIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* Fireworks */
.firework {
    position: fixed;
    font-size: 24px;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(0); opacity: 1; }
    to { transform: scale(2); opacity: 0; }
}

/* Responsive */
@media (max-width: 768px) {
    #hero { width: 140px; }
    #gf { width: 220px; }
    #cake-container {
        width: 220px;
        height: 220px;
        bottom: 180px;
    }
    #finalText { font-size: 36px; }
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️</h1>

<div class="scene">
    <!-- Your Avatar -->
    <img id="hero" src="cake.png" class="avatar" alt="Hero with Cake">

    <!-- Girlfriend Avatar -->
    <img id="gf" src="gf.png" class="avatar" alt="Girlfriend">

    <!-- Cake -->
    <div id="cake-container">
        <div id="candle">🕯️</div>
        <div id="knife">🔪</div>
        <div class="cake-base"></div>

        <!-- Cake Slices -->
        <div class="slice slice1"></div>
        <div class="slice slice2"></div>
        <div class="slice slice3"></div>
        <div class="slice slice4"></div>
        <div class="slice slice5"></div>
        <div class="slice slice6"></div>
    </div>
</div>

<!-- Controls -->
<button id="blowBtn" class="btn">Blow Candle 🕯️</button>

<p id="message"></p>
<h2 id="finalText">🎉 HAPPY BIRTHDAY MY LOVE ❤️🎂</h2>

<script src="script.js"></script>

<script>
const hero = document.getElementById("hero");
const gf = document.getElementById("gf");
const cakeContainer = document.getElementById("cake-container");
const knife = document.getElementById("knife");
const candle = document.getElementById("candle");
const message = document.getElementById("message");
const finalText = document.getElementById("finalText");
const blowBtn = document.getElementById("blowBtn");
const slices = document.querySelectorAll(".slice");

let currentSlice = 0;

/* Step 1: Hero enters */
setTimeout(() => {
    hero.classList.add("walk-in");
}, 500);

/* Step 2: Girlfriend appears after 1.5 sec */
setTimeout(() => {
    gf.style.display = "block";
}, 2000);

/* Step 3: Cake appears */
setTimeout(() => {
    cakeContainer.style.display = "block";
    blowBtn.style.display = "inline-block";
    message.innerText = "Blow the candle, my love 💖";
}, 3500);

/* Blow Candle Button */
blowBtn.addEventListener("click", () => {
    candle.style.display = "none";
    blowBtn.style.display = "none";
    message.innerText = "Tap the cake to cut it! 🎂";
});

/* Cut Cake One Slice at a Time */
cakeContainer.addEventListener("click", (e) => {
    if (candle.style.display !== "none") return;
    if (currentSlice >= slices.length) return;

    const rect = cakeContainer.getBoundingClientRect();
    knife.style.left = (e.clientX - rect.left - 25) + "px";
    knife.style.top = (e.clientY - rect.top - 25) + "px";
    knife.style.display = "block";

    slices[currentSlice].classList.add("cut");
    currentSlice++;

    if (currentSlice === slices.length) {
        setTimeout(showCelebration, 800);
    }
});

/* Celebration Effects */
function showCelebration() {
    message.innerText = "Happy Birthday My Love ❤️🎂";
    finalText.style.display = "block";
    launchHearts(40);
    launchFireworks(30);
}

/* Hearts Animation */
function launchHearts(count) {
    for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "0";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
    }
}

/* Fireworks Animation */
function launchFireworks(count) {
    for (let i = 0; i < count; i++) {
        const fire = document.createElement("div");
        fire.className = "firework";
        fire.innerHTML = "✨";
        fire.style.left = Math.random() * 100 + "vw";
        fire.style.top = Math.random() * 60 + "vh";
        document.body.appendChild(fire);
        setTimeout(() => fire.remove(), 1200);
    }
}
</script>

</body>
</html>
