<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Birthday Surprise 🎂</title>
<link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    text-align: center;
    color: white;
    overflow-x: hidden;
}

h1 {
    margin-top: 20px;
    font-size: 26px;
}

/* Scene Layout */
.scene {
    position: relative;
    height: 75vh;
    width: 100%;
}

/* Avatars */
.avatar {
    position: absolute;
    bottom: 0;
    transition: all 1.5s ease;
}

#hero {
    width: 160px;
    left: -40%;
}

#gf {
    width: 220px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
}

.walk-in {
    left: 20%;
}

/* Cake Container */
#cake-container {
    position: absolute;
    width: 260px;
    height: 260px;
    left: 50%;
    transform: translateX(-50%);
    bottom: 200px;
    display: none;
    cursor: pointer;
}

/* Candle */
#candle {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
}

/* Cake Slices */
.slice {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url('cake2.png') center/cover no-repeat;
    transition: transform 0.8s ease;
}

/* Single Slice */
.slice-main {
    clip-path: polygon(50% 50%, 60% 0%, 75% 0%, 55% 55%);
}

.slice-rest {
    clip-path: circle(50% at 50% 50%);
}

/* Cutting Animation */
.cut .slice-main {
    transform: translate(40px, -40px) rotate(15deg);
}

/* Knife */
#knife {
    position: absolute;
    font-size: 50px;
    display: none;
    pointer-events: none;
    transform: rotate(-45deg);
    z-index: 10;
}

/* Button */
button {
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ff4d6d, #ff85a2);
    color: white;
    font-size: 18px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Hearts */
.heart {
    position: fixed;
    font-size: 22px;
    animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-250px); opacity: 0; }
}

#message {
    font-size: 22px;
    margin-top: 15px;
    font-weight: bold;
}

/* Responsive */
@media (max-width: 768px) {
    #hero { width: 120px; }
    #gf { width: 170px; }
    #cake-container {
        width: 200px;
        height: 200px;
        bottom: 160px;
    }
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️</h1>

<div class="scene">
    <!-- Your Avatar -->
    <img id="hero" src="cake.png" class="avatar" alt="Hero with Cake">

    <!-- Girlfriend Avatar -->
    <img id="gf" src="gf.png" class="avatar" alt="Girlfriend">

    <!-- Cake -->
    <div id="cake-container">
        <div id="candle">🕯️</div>
        <div id="knife">🔪</div>
        <div class="slice slice-rest"></div>
        <div class="slice slice-main"></div>
    </div>
</div>

<button id="blowBtn" style="display:none;" onclick="blowCandle()">
    Blow Candle 🕯️
</button>

<p id="message"></p>

<script src="script.js"></script>

<script>
const hero = document.getElementById("hero");
const gf = document.getElementById("gf");
const cakeContainer = document.getElementById("cake-container");
const knife = document.getElementById("knife");
const candle = document.getElementById("candle");
const message = document.getElementById("message");
const blowBtn = document.getElementById("blowBtn");

let cut = false;

/* Step 1: Hero enters with cake */
setTimeout(() => {
    hero.classList.add("walk-in");
}, 300);

/* Step 2: Girlfriend enters after 1.5 sec */
setTimeout(() => {
    gf.style.display = "block";
}, 1800);

/* Step 3: Cake appears */
setTimeout(() => {
    cakeContainer.style.display = "block";
    blowBtn.style.display = "inline-block";
    message.innerText = "Blow the candle, my love 💖";
}, 3000);

/* Step 4: Blow Candle */
function blowCandle() {
    candle.style.display = "none";
    blowBtn.style.display = "none";
    message.innerText = "Tap the cake to cut it! 🎂";
}

/* Step 5: Cut Single Slice */
cakeContainer.addEventListener("click", (e) => {
    if (cut || candle.style.display !== "none") return;
    cut = true;

    const rect = cakeContainer.getBoundingClientRect();
    knife.style.left = (e.clientX - rect.left - 25) + "px";
    knife.style.top = (e.clientY - rect.top - 25) + "px";
    knife.style.display = "block";

    setTimeout(() => {
        cakeContainer.classList.add("cut");
        message.innerText = "Happy Birthday My Love ❤️🎂";
        launchHearts(40);
    }, 200);
});

/* Heart Burst */
function launchHearts(count) {
    for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "0px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
    }
}
</script>

</body>
</html>
