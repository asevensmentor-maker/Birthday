<!DOCTYPE html>
<html>
<head>
    <title>Final Birthday Surprise 🎂</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin-top: 20px;
            font-size: 24px;
        }

        .scene {
            position: relative;
            height: 75vh;
        }

        /* Avatar Styling */
        .avatar {
            position: absolute;
            bottom: 0;
            height: 140px;
            width: auto;
        }

        /* Your Avatar Walking with Cake */
        #hero {
            left: -200px;
            height: 170px;
            animation: walkIn 3s forwards;
        }

        /* Dancing Avatar */
        #danceAvatar {
            left: 10%;
            display: none;
            animation: dance 0.6s infinite alternate;
        }

        /* Stitch */
        #stitch {
            right: 10%;
            display: none;
            animation: dance 0.6s infinite alternate;
        }

        /* Girlfriend Avatar */
        #gf {
            left: 50%;
            transform: translateX(-50%);
            height: 170px;
            display: none;
            animation: fadeInUp 1.5s ease forwards;
        }

        /* Cake Container */
        #cakeContainer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 140px;
            display: none;
        }

        #cake {
            width: 170px;
            transition: transform 0.5s ease;
        }

        #cake.slice {
            transform: rotate(-10deg) scale(0.9);
        }

        #candle {
            font-size: 26px;
            margin-bottom: -15px;
        }

        /* Buttons */
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            background: white;
            color: #ff4f81;
            font-size: 14px;
            margin: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #ffe6ec;
        }

        /* Wish Box */
        #wishBox {
            display: none;
            margin-top: 10px;
        }

        input {
            padding: 10px;
            border-radius: 20px;
            border: none;
            width: 220px;
            text-align: center;
        }

        /* Animations */
        @keyframes walkIn {
            to {
                left: 50%;
                transform: translateX(-50%);
            }
        }

        @keyframes dance {
            from { transform: translateY(0) rotate(-5deg); }
            to { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 40px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Hearts */
        .heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp 3s linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-200px);
                opacity: 0;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .avatar { height: 110px; }
            #hero { height: 140px; }
            #gf { height: 140px; }
            #cake { width: 140px; }
        }
    </style>
</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️ 🎉</h1>

<div class="scene">

    <!-- Your Avatar with Cake -->
    <img id="hero" src="cake.png" class="avatar">

    <!-- Dancing Avatars -->
    <img id="danceAvatar" src="dancing.png" class="avatar">
    <img id="stitch" src="stitch.png" class="avatar">

    <!-- Girlfriend Avatar -->
    <img id="gf" src="gf.png" class="avatar">

    <!-- Cake -->
    <div id="cakeContainer">
        <div id="candle">🕯️</div>
        <img id="cake" src="cake1.png">
    </div>

</div>

<!-- Controls -->
<div id="controls">
    <button id="blowBtn" style="display:none;" onclick="blowCandle()">
        Blow Candle 🕯️
    </button>
    <button id="wishBtn" style="display:none;" onclick="showWish()">
        Make a Wish 💖
    </button>
    <button id="cutBtn" style="display:none;" onclick="cutCake()">
        Cut Cake 🎂
    </button>
</div>

<!-- Wish Input -->
<div id="wishBox">
    <input type="text" id="wishInput" placeholder="Type your wish...">
    <br><br>
    <button id="submitWishBtn" onclick="saveWish()">Submit Wish ✨</button>
</div>

<p id="message"></p>

<!-- Music -->
<audio autoplay loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>
    // Step 1: Hero walks in
    window.onload = function() {
        document.getElementById("hero").style.animation =
            "walkIn 3s forwards";
    };

    // Step 2: Dancers appear
    setTimeout(() => {
        document.getElementById("danceAvatar").style.display = "block";
        document.getElementById("stitch").style.display = "block";
    }, 3000);

    // Step 3: GF appears
    setTimeout(() => {
        document.getElementById("gf").style.display = "block";
    }, 5000);

    // Step 4: Cake appears
    setTimeout(() => {
        document.getElementById("cakeContainer").style.display = "block";
        document.getElementById("blowBtn").style.display = "inline-block";
    }, 7000);

    // Blow Candle
    function blowCandle() {
        document.getElementById("candle").style.display = "none";
        document.getElementById("blowBtn").style.display = "none";
        document.getElementById("wishBtn").style.display = "inline-block";
    }

    // Show Wish Box
    function showWish() {
        document.getElementById("wishBtn").style.display = "none";
        document.getElementById("wishBox").style.display = "block";
    }

    // Save Wish
    function saveWish() {
        const wish = document.getElementById("wishInput").value.trim();

        if (wish === "") {
            alert("Please enter your wish 💖");
            return;
        }

        document.getElementById("wishBox").style.display = "none";
        document.getElementById("message").innerText =
            "Her Wish: " + wish + " 💖";

        document.getElementById("cutBtn").style.display = "inline-block";
    }

    // Cut Cake
    function cutCake() {
        document.getElementById("cake").classList.add("slice");
        document.getElementById("message").innerText =
            "Happy Birthday My Love ❤️🎂";

        launchHearts();
    }

    // Heart Celebration
    function launchHearts() {
        for (let i = 0; i < 40; i++) {
            let heart = document.createElement("div");
            heart.innerHTML = "💖";
            heart.className = "heart";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.bottom = "100px";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 3000);
        }
    }
</script>

</body>
</html>
