<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Birthday Surprise 🎂</title>
<link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    text-align: center;
    color: white;
    overflow-x: hidden;
}

h1 {
    margin-top: 20px;
    font-size: 26px;
}

/* Scene Layout */
.scene {
    position: relative;
    height: 75vh;
    width: 100%;
    overflow: hidden;
}

/* Avatars */
.avatar {
    position: absolute;
    bottom: 0;
    transition: all 2s ease;
}

#hero {
    width: 150px;
    left: -40%;
}

#stitch {
    width: 150px;
    right: -40%;
}

#gf {
    width: 220px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
}

/* Animation Classes */
.walk-left { left: 15%; }
.walk-right { right: 15%; }
.exit-left { left: -50%; }
.exit-right { right: -50%; }

/* Cake Container */
#cake-container {
    position: absolute;
    width: 260px;
    height: 260px;
    left: 50%;
    transform: translateX(-50%);
    bottom: 180px;
    display: none;
    cursor: pointer;
}

/* Candle */
#candle {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
}

/* Cake Slices */
.slice {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: url('cake2.png');
    background-size: cover;
    background-position: center;
    transition: transform 0.8s ease;
}

/* 6 Realistic Cake Slices */
.slice1 { clip-path: polygon(50% 50%, 50% 0%, 75% 0%, 60% 50%); }
.slice2 { clip-path: polygon(50% 50%, 75% 0%, 100% 50%, 60% 50%); }
.slice3 { clip-path: polygon(50% 50%, 100% 50%, 75% 100%, 50% 75%); }
.slice4 { clip-path: polygon(50% 50%, 75% 100%, 25% 100%, 40% 50%); }
.slice5 { clip-path: polygon(50% 50%, 25% 100%, 0% 50%, 40% 50%); }
.slice6 { clip-path: polygon(50% 50%, 0% 50%, 25% 0%, 50% 0%); }

/* Knife */
#knife {
    position: absolute;
    font-size: 50px;
    display: none;
    pointer-events: none;
    transform: rotate(-45deg);
    z-index: 10;
}

/* Slice Animation */
.cut .slice1 { transform: translate(-40px, -50px); }
.cut .slice2 { transform: translate(50px, -40px); }
.cut .slice3 { transform: translate(60px, 40px); }
.cut .slice4 { transform: translate(0px, 60px); }
.cut .slice5 { transform: translate(-60px, 40px); }
.cut .slice6 { transform: translate(-50px, -40px); }

/* Floating Hearts */
.heart {
    position: fixed;
    font-size: 22px;
    animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-250px);
        opacity: 0;
    }
}

#message {
    margin-top: 15px;
    font-size: 20px;
}

/* Mobile Responsive */
@media (max-width: 768px) {
    #hero, #stitch { width: 110px; }
    #gf { width: 160px; }
    #cake-container {
        width: 200px;
        height: 200px;
        bottom: 150px;
    }
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️</h1>

<div class="scene">
    <!-- Your Avatar -->
    <img id="hero" src="cake.png" class="avatar" alt="Hero">

    <!-- Stitch -->
    <img id="stitch" src="stitch.png" class="avatar" alt="Stitch">

    <!-- Girlfriend -->
    <img id="gf" src="gf.png" class="avatar" alt="Girlfriend">

    <!-- Realistic Cake -->
    <div id="cake-container">
        <div id="candle">🕯️</div>
        <div id="knife">🔪</div>
        <div class="slice slice1"></div>
        <div class="slice slice2"></div>
        <div class="slice slice3"></div>
        <div class="slice slice4"></div>
        <div class="slice slice5"></div>
        <div class="slice slice6"></div>
    </div>
</div>

<p id="message"></p>

<script src="script.js"></script>

<script>
const hero = document.getElementById("hero");
const stitch = document.getElementById("stitch");
const gf = document.getElementById("gf");
const cakeContainer = document.getElementById("cake-container");
const knife = document.getElementById("knife");
const candle = document.getElementById("candle");
const message = document.getElementById("message");

let cut = false;

/* Step-by-step Romantic Animation */

// 1. Hero walks in
setTimeout(() => {
    hero.classList.add("walk-left");
}, 500);

// 2. Stitch walks in
setTimeout(() => {
    stitch.classList.add("walk-right");
}, 2000);

// 3. Girlfriend appears
setTimeout(() => {
    gf.style.display = "block";
}, 4000);

// 4. Hero and Stitch exit
setTimeout(() => {
    hero.classList.add("exit-left");
    stitch.classList.add("exit-right");
}, 6000);

// 5. Cake appears
setTimeout(() => {
    cakeContainer.style.display = "block";
    message.innerText = "Tap the cake to cut it! 🎂";
}, 8000);

/* Cake Cutting Interaction */
cakeContainer.addEventListener("click", (e) => {
    if (cut) return;
    cut = true;

    const rect = cakeContainer.getBoundingClientRect();
    knife.style.left = (e.clientX - rect.left - 25) + "px";
    knife.style.top = (e.clientY - rect.top - 25) + "px";
    knife.style.display = "block";

    setTimeout(() => {
        cakeContainer.classList.add("cut");
        candle.style.display = "none";
        message.innerText = "Happy Birthday My Love ❤️🎂";
        launchHearts(40);
    }, 200);
});

/* Floating Hearts */
function launchHearts(count) {
    for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "0";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
    }
}
</script>

</body>
</html>
