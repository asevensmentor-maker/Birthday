<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Final Birthday Surprise 🎂</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 20px;
            font-size: 26px;
        }

        .scene {
            position: relative;
            height: 75vh;
            width: 100%;
            overflow: hidden;
        }

        /* Characters */
        .avatar {
            position: absolute;
            bottom: 0;
            transition: all 2s ease;
        }

        #hero {
            left: -40%;
            width: 160px;
        }

        #stitch {
            right: -40%;
            width: 160px;
        }

        #gf {
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            display: none;
        }

        /* Walking Animation */
        .walk-in-left {
            left: 20%;
        }

        .walk-in-right {
            right: 20%;
        }

        .exit-left {
            left: -50%;
        }

        .exit-right {
            right: -50%;
        }

        /* Cake */
        #cakeContainer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 200px;
            display: none;
        }

        #cake {
            width: 220px;
            transition: transform 0.5s ease;
        }

        #cake.slice {
            transform: rotate(-10deg) scale(0.95);
        }

        #candle {
            font-size: 30px;
            margin-bottom: -10px;
        }

        /* Buttons */
        .controls {
            margin-top: 20px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #ff4d6d, #ff85a2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #wishBox {
            display: none;
            margin-top: 15px;
        }

        input {
            padding: 12px;
            border-radius: 20px;
            border: none;
            width: 260px;
            text-align: center;
        }

        .heart {
            position: fixed;
            font-size: 22px;
            animation: floatUp 3s linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-250px);
                opacity: 0;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #hero, #stitch {
                width: 120px;
            }

            #gf {
                width: 140px;
            }

            #cake {
                width: 180px;
            }

            #cakeContainer {
                bottom: 160px;
            }
        }
    </style>
</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️</h1>

<div class="scene">
    <!-- Your Avatar -->
    <img id="hero" src="cake.png" class="avatar" alt="Hero">

    <!-- Stitch -->
    <img id="stitch" src="stitch.png" class="avatar" alt="Stitch">

    <!-- Girlfriend -->
    <img id="gf" src="gf.png" class="avatar" alt="Girlfriend">

    <!-- Cake -->
    <div id="cakeContainer">
        <div id="candle">🕯️</div>
        <img id="cake" src="cake2.png" alt="Birthday Cake">
    </div>
</div>

<div class="controls">
    <button id="blowBtn" style="display:none;" onclick="blowCandle()">Blow Candle 🕯️</button>
    <button id="cutBtn" style="display:none;" onclick="cutCake()">Cut Cake 🎂</button>
</div>

<p id="message"></p>

<script src="script.js"></script>

<script>
    // Step 1: You walk in with cake
    setTimeout(() => {
        document.getElementById("hero").classList.add("walk-in-left");
    }, 500);

    // Step 2: Stitch enters
    setTimeout(() => {
        document.getElementById("stitch").classList.add("walk-in-right");
    }, 2000);

    // Step 3: Girlfriend appears
    setTimeout(() => {
        document.getElementById("gf").style.display = "block";
    }, 4000);

    // Step 4: Hero and Stitch exit
    setTimeout(() => {
        document.getElementById("hero").classList.add("exit-left");
        document.getElementById("stitch").classList.add("exit-right");
    }, 6000);

    // Step 5: Cake appears
    setTimeout(() => {
        document.getElementById("cakeContainer").style.display = "block";
        document.getElementById("blowBtn").style.display = "inline-block";
    }, 8000);

    function blowCandle() {
        document.getElementById("candle").style.display = "none";
        document.getElementById("blowBtn").style.display = "none";
        document.getElementById("cutBtn").style.display = "inline-block";
        document.getElementById("message").innerText = "Make a wish, my love 💖";
    }

    function cutCake() {
        document.getElementById("cake").classList.add("slice");
        document.getElementById("message").innerText =
            "Happy Birthday My Love ❤️🎂";
        launchHearts(40);
    }
</script>

</body>
</html>
