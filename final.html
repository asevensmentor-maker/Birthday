<!DOCTYPE html>
<html>
<head>
    <title>Final Birthday Surprise 🎂</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎉 Happy Birthday My Love ❤️ 🎉</h1>

<div class="scene">
    <div id="cakeContainer">
        <div id="candle">🕯️</div>
        <img id="cake" src="cake2.png">
    </div>

    <div class="characters">
        <img id="hero" src="cake.png" class="avatar">
        <img id="gf" src="gf.png" class="avatar">
        <img id="stitch" src="stitch.png" class="avatar">
    </div>
</div>

<div>
    <button class="btn" id="blowBtn" onclick="blowCandle()">Blow Candle 🕯️</button>
    <button class="btn" id="wishBtn" style="display:none;" onclick="showWish()">Make a Wish 💖</button>
    <button class="btn" id="cutBtn" style="display:none;" onclick="cutCake()">Cut Cake 🎂</button>
</div>

<div id="wishBox" style="display:none;">
    <input type="text" id="wishInput" placeholder="Type your wish...">
    <br><br>
    <button class="btn" onclick="saveWish()">Submit Wish ✨</button>
</div>

<p id="message"></p>

<script src="script.js"></script>
<script>
function blowCandle() {
    document.getElementById("candle").style.display = "none";
    document.getElementById("blowBtn").style.display = "none";
    document.getElementById("wishBtn").style.display = "inline-block";
}

function showWish() {
    document.getElementById("wishBox").style.display = "block";
    document.getElementById("wishBtn").style.display = "none";
}

function saveWish() {
    const wish = document.getElementById("wishInput").value;
    if (!wish.trim()) {
        alert("Please enter your wish 💖");
        return;
    }
    document.getElementById("message").innerText = "Her Wish: " + wish + " 💖";
    document.getElementById("wishBox").style.display = "none";
    document.getElementById("cutBtn").style.display = "inline-block";
}

function cutCake() {
    document.getElementById("cake").classList.add("slice");
    document.getElementById("message").innerText =
        "Happy Birthday My Love ❤️🎂";
    launchHearts(40);
}
</script>
</body>
</html>
