<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday ❤️</title>

<style>
body {
  margin:0;
  background:#ff6f91;
  font-family: Arial;
  text-align:center;
  overflow:hidden;
  color:white;
}

/* TITLE */
h1 {
  margin-top:20px;
}

/* CENTER AREA */
.scene {
  position:relative;
  height:70vh;
}

/* AVATARS */
.avatar {
  width:120px;
  position:absolute;
  bottom:0;
}

/* YOU WALK */
#you {
  left:-150px;
  animation: walkYou 3s forwards;
}

/* GF WALK */
#gf {
  right:-150px;
  display:none;
  animation: walkGF 3s forwards;
}

/* STITCH */
#stitch {
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  animation: dance 0.5s infinite alternate;
}

/* CAKE */
#cake {
  width:150px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:120px;
  display:none;
}

/* CANDLE */
#candle {
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:200px;
  font-size:25px;
  display:none;
}

/* BUTTON */
button {
  padding:10px 15px;
  border:none;
  border-radius:20px;
  margin:10px;
  font-size:14px;
}

/* ANIMATIONS */
@keyframes walkYou {
  to { left:20%; }
}

@keyframes walkGF {
  to { right:20%; }
}

@keyframes dance {
  from { transform: translateX(-50%) rotate(-5deg); }
  to { transform: translateX(-50%) rotate(5deg); }
}

/* HEART */
.heart {
  position:absolute;
  font-size:20px;
  animation: float 3s linear forwards;
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-200px); opacity:0; }
}
</style>

</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️ 🎉</h1>

<div class="scene">

  <!-- YOU -->
  <img id="you" src="standing.png" class="avatar">

  <!-- GF -->
  <img id="gf" src="gf.png" class="avatar">

  <!-- STITCH -->
  <img id="stitch" src="stitch.png" class="avatar">

  <!-- CAKE -->
  <img id="cake" src="cake.png">

  <!-- CANDLE -->
  <div id="candle">🕯️</div>

</div>

<!-- BUTTONS -->
<div id="controls">
  <button id="blowBtn" onclick="blow()">Blow Candle 🕯️</button>
  <button id="cutBtn" onclick="cut()" style="display:none;">Cut Cake 🎂</button>
</div>

<p id="msg"></p>

<script>

/* STEP 1: GF APPEAR */
setTimeout(()=>{
  document.getElementById("gf").style.display="block";
},3000);

/* STEP 2: SHOW CAKE */
setTimeout(()=>{
  document.getElementById("cake").style.display="block";
  document.getElementById("candle").style.display="block";
},5000);

/* BLOW CANDLE */
function blow(){
  document.getElementById("candle").style.display="none";
  document.getElementById("msg").innerText="Make a wish 💖";

  document.getElementById("blowBtn").style.display="none";
  document.getElementById("cutBtn").style.display="inline-block";
}

/* CUT CAKE */
function cut(){
  document.getElementById("msg").innerText="Happy Birthday My Love ❤️🎂";

  explode();
}

/* HEART EXPLOSION */
function explode(){
  for(let i=0;i<40;i++){
    let h=document.createElement("div");
    h.innerHTML="💖";
    h.classList.add("heart");

    h.style.left=Math.random()*100+"vw";
    h.style.bottom="100px";

    document.body.appendChild(h);

    setTimeout(()=>h.remove(),3000);
  }
}

</script>

</body>
</html>
