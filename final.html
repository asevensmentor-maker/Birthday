<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday My Love 🎂</title>

<style>
body {
  margin:0;
  background: linear-gradient(#ff758c, #ff7eb3);
  color:white;
  text-align:center;
  font-family: Arial;
  overflow:hidden;
}

/* AVATARS */
.avatar {
  width:140px;
  position:absolute;
  bottom:100px;
}

/* WALK */
#you { left:-200px; animation: walkYou 4s forwards; }
#gf { right:-200px; display:none; animation: walkGF 4s forwards; }

/* CAKE */
#cake {
  width:200px;
  margin-top:100px;
  display:none;
  transition: all 0.5s;
}

/* CANDLE */
#candle {
  position:absolute;
  top:120px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
}

/* BLOW EFFECT */
.blown {
  opacity:0;
}

/* SLICE */
.slice {
  transform: rotate(-15deg) scale(0.9);
}

/* BUTTON */
button {
  padding:12px 20px;
  border:none;
  border-radius:25px;
  margin:10px;
  font-size:16px;
  cursor:pointer;
}

/* WISH BOX */
#wishBox {
  display:none;
  margin-top:20px;
}

input {
  padding:10px;
  border-radius:20px;
  border:none;
  width:200px;
}

/* HEARTS */
.heart {
  position:absolute;
  font-size:20px;
  animation: float 3s linear forwards;
}

@keyframes float {
  0% { transform: translateY(0); opacity:1; }
  100% { transform: translateY(-200px); opacity:0; }
}

/* WALK ANIMATIONS */
@keyframes walkYou { to { left:30%; } }
@keyframes walkGF { to { right:30%; } }
</style>

</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️ 🎉</h1>

<audio autoplay loop>
  <source src="birthday.mp3">
</audio>

<!-- AVATARS -->
<img id="you" src="standing.png" class="avatar">
<img id="gf" src="gf.png" class="avatar">

<!-- CAKE -->
<img id="cake" src="cake.png">
<div id="candle">🕯️</div>

<br>

<button id="blowBtn" onclick="blowCandle()" style="display:none;">
  Blow Candle 🕯️
</button>

<div id="wishBox">
  <p>Make a wish 💖</p>
  <input type="text" id="wishInput" placeholder="Type your wish...">
  <br>
  <button onclick="saveWish()">Done ✨</button>
</div>

<button id="cutBtn" onclick="cutCake()" style="display:none;">
  Cut Cake 🎂
</button>

<p id="msg"></p>

<script>

// GF appears
setTimeout(()=>{
  document.getElementById("gf").style.display = "block";
},4000);

// Show cake
setTimeout(()=>{
  document.getElementById("cake").style.display = "block";
  document.getElementById("blowBtn").style.display = "inline-block";
},7000);

// BLOW CANDLE
function blowCandle(){
  document.getElementById("candle").classList.add("blown");
  document.getElementById("msg").innerText = "Make a wish 💖";

  document.getElementById("wishBox").style.display = "block";
}

// SAVE WISH
function saveWish(){
  const wish = document.getElementById("wishInput").value;

  document.getElementById("msg").innerText =
    "Your wish: " + wish + " 💖";

  document.getElementById("wishBox").style.display = "none";
  document.getElementById("cutBtn").style.display = "inline-block";
}

// CUT CAKE
function cutCake(){

  const cake = document.getElementById("cake");
  cake.classList.add("slice");

  document.getElementById("msg").innerText =
    "Happy Birthday My Love ❤️🎂";

  celebrate();
}

// HEART CELEBRATION
function celebrate(){
  for(let i=0;i<70;i++){
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.classList.add("heart");

    heart.style.left = Math.random()*100+"vw";
    heart.style.top = "60%";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),3000);
  }
}

</script>

</body>
</html>
