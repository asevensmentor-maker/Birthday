<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Final Birthday Surprise 🎂</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 20px;
            font-size: 26px;
        }

        .instruction {
            font-size: 18px;
            margin-top: 10px;
        }

        /* Scene Layout */
        .scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Cake Game */
        #game-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 20px auto;
            cursor: crosshair;
        }

        .cake-part {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ff80ab;
            border-radius: 50%;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 12px 0 #f06292;
        }

        .cake-part::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
        }

        #left-half {
            clip-path: inset(0 50% 0 0);
        }

        #right-half {
            clip-path: inset(0 0 0 50%);
        }

        /* Knife */
        #knife {
            position: absolute;
            font-size: 50px;
            pointer-events: none;
            display: none;
            transform: rotate(-45deg);
            z-index: 10;
        }

        /* Characters */
        .characters {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .avatar {
            transition: transform 0.3s ease;
        }

        #hero {
            width: 150px;
        }

        #gf {
            width: 220px; /* Increased size */
        }

        #stitch {
            width: 160px;
        }

        /* Candle */
        #candle {
            font-size: 30px;
            margin-bottom: -10px;
        }

        /* Message */
        #message {
            margin-top: 15px;
            font-size: 20px;
        }

        /* Floating Hearts */
        .heart {
            position: fixed;
            font-size: 22px;
            animation: floatUp 3s linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-250px);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 22px; }

            #hero { width: 110px; }
            #gf { width: 170px; }
            #stitch { width: 120px; }

            #game-container {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>

<body>

<h1>🎉 Happy Birthday My Love ❤️</h1>
<p class="instruction">Tap the cake to cut it! 🎂</p>

<div class="scene">
    <div id="candle">🕯️</div>

    <!-- Tap-to-Cut Cake -->
    <div id="game-container">
        <div id="knife">🔪</div>
        <div id="left-half" class="cake-part"></div>
        <div id="right-half" class="cake-part"></div>
    </div>

    <!-- Characters -->
    <div class="characters">
        <img id="hero" src="cake.png" class="avatar" alt="Hero">
        <img id="gf" src="gf.png" class="avatar" alt="Girlfriend">
        <img id="stitch" src="stitch.png" class="avatar" alt="Stitch">
    </div>
</div>

<p id="message"></p>

<script src="script.js"></script>

<script>
    const container = document.getElementById('game-container');
    const knife = document.getElementById('knife');
    const leftHalf = document.getElementById('left-half');
    const rightHalf = document.getElementById('right-half');
    const candle = document.getElementById('candle');
    const message = document.getElementById('message');

    let sliced = false;

    container.addEventListener('click', (e) => {
        if (sliced) return;

        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Show knife
        knife.style.display = 'block';
        knife.style.left = (x - 25) + 'px';
        knife.style.top = (y - 25) + 'px';

        // Slice animation
        setTimeout(() => {
            leftHalf.style.transform = 'translateX(-40px) rotate(-8deg)';
            rightHalf.style.transform = 'translateX(40px) rotate(8deg)';
            sliced = true;

            candle.style.display = 'none';
            message.innerText = "Happy Birthday My Love ❤️🎂";

            launchHearts(40);

            setTimeout(() => {
                knife.style.opacity = '0';
            }, 200);
        }, 50);
    });

    function launchHearts(count) {
        for (let i = 0; i < count; i++) {
            let heart = document.createElement("div");
            heart.innerHTML = "💖";
            heart.className = "heart";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.bottom = "50px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }
    }
</script>

</body>
</html>
