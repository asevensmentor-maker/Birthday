<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet"><style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

.btn {
  padding: 14px 24px;
  background: white;
  color: #ff4d6d;
  border: none;
  border-radius: 30px;
  font-weight: bold;
  cursor: pointer;
}

/* WALK */
#walk {
  position: absolute;
  left: -300px;
  top: 180px;
  width: 220px;
  display: none;
}

.walk-animate {
  animation: walkMove 6s ease-in-out forwards, bounce 0.5s infinite alternate;
}

@keyframes walkMove {
  0% { left: -300px; transform: scale(0.8); }
  100% { left: 50%; transform: translateX(-50%) scale(1.1); }
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-10px); }
}

/* DANCE */
#dance {
  display: none;
  width: 220px;
  margin-top: 250px;
}

.dance-animate {
  animation: dance 0.4s infinite alternate, glow 2s infinite;
}

@keyframes dance {
  from { transform: rotate(-8deg) scale(1); }
  to { transform: rotate(8deg) scale(1.1); }
}

@keyframes glow {
  0% { filter: drop-shadow(0 0 5px pink); }
  100% { filter: drop-shadow(0 0 20px red); }
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.confetti div {
  position: absolute;
  width: 8px;
  height: 8px;
  background: yellow;
  animation: fall 4s linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-10vh); }
  100% { transform: translateY(100vh); }
}

.section { display:none; margin-top:40px; }
.gallery img { width:150px; margin:10px; border-radius:10px; }
</style></head><body><h1>Happy Birthday My Love ❤️</h1>
<p>This world is made just for you 💖</p><button class="btn" onclick="startSurprise()">Enter Surprise 🎁</button>

<div class="confetti" id="confetti"></div><img id="walk" src="walk.png">
<img id="dance" src="dance.png"><div id="love" class="section">
  <h2>💖 You Are</h2>
  <p>🧸 Cute like Stitch <br> 🍦 Sweet like Ice Cream <br> 🍫 Sweeter than Chocolate</p>
</div><div id="gallery" class="section">
  <h2>📸 Our Memories</h2>
  <img src="photo1.jpg"><img src="photo2.jpg"><img src="photo3.jpg">
</div><div id="final" class="section">
  <h2>💌 For You</h2>
  <p>I love you forever ❤️ Happy Birthday 🎂</p>
</div><audio id="music">
  <source src="birthday.mp3">
</audio><script>
function startSurprise(){
  const walk = document.getElementById('walk');
  const dance = document.getElementById('dance');
  document.getElementById('music').play();

  walk.style.display='block';
  setTimeout(()=>walk.classList.add('walk-animate'),100);

  // CONFETTI
  setTimeout(()=>{
    const confetti = document.getElementById('confetti');
    for(let i=0;i<80;i++){
      const c=document.createElement('div');
      c.style.left=Math.random()*100+'vw';
      c.style.background=['red','yellow','pink'][Math.floor(Math.random()*3)];
      confetti.appendChild(c);
    }
  },3000);

  setTimeout(()=>{
    walk.style.display='none';
    dance.style.display='block';
    dance.classList.add('dance-animate');
  },6000);

  setTimeout(()=>document.getElementById('love').style.display='block',8000);
  setTimeout(()=>document.getElementById('gallery').style.display='block',10000);
  setTimeout(()=>document.getElementById('final').style.display='block',12000);
}
</script></body>
</html>
