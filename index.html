<!DOCTYPE html>
<html>
<head>
    <title>Love Fight Game 💖</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎉 Happy Birthday My Love ❤️</h1>
    <p>Are you ready for your surprise?</p>
    <button class="btn" onclick="go(2)">Yes 💖</button>
    <button class="btn" onmouseover="run(this)">No 😜</button>
</div>

<div id="screen2" class="container" style="display:none;">
    <h2>Enter the Fight Arena 🎮</h2>
    <button class="btn" onclick="go(3)">Start Battle 💥</button>
</div>

<div id="screen3" class="container" style="display:none;">
    <h2>💖 Fight for Her Heart 💖</h2>

    <div class="game">
        <div>
            <img id="you" src="avatar.png" class="character">
            <p>You ❤️</p>
            <div class="bar"><div id="youHP" class="hp" style="width:100%"></div></div>
        </div>

        <div>
            <img id="stitch" src="stitch.png" class="character">
            <p>Stitch 🧸</p>
            <div class="bar"><div id="stitchHP" class="hp" style="width:100%"></div></div>
        </div>
    </div>

    <button class="btn" onclick="attack()">Attack 👊</button>
    <button class="btn" onclick="power()">Power 💥</button>
</div>

<div id="screen4" class="container" style="display:none;">
    <h1>🏆 I AM YOUR FAVORITE ❤️</h1>
    <p>But you are my everything 💖</p>
    <button class="btn" data-link="chocolate.html">Next Surprise 🍫</button>
</div>

<script src="script.js"></script>
<script>
function go(n) {
    document.querySelectorAll('.container').forEach(el => el.style.display = 'none');
    document.getElementById('screen' + n).style.display = 'block';
}

function run(btn) {
    btn.style.position = 'absolute';
    btn.style.left = Math.random() * 80 + 'vw';
    btn.style.top = Math.random() * 80 + 'vh';
}

let you = 100, stitch = 100;

function update() {
    youHP.style.width = you + "%";
    stitchHP.style.width = stitch + "%";
}

function attack() {
    stitch -= 15;
    you -= 5;
    update();
    check();
}

function power() {
    stitch -= 25;
    you -= 10;
    update();
    check();
}

function check() {
    if (stitch <= 0) go(4);
    if (you <= 0) location.reload();
}
</script>
</body>
</html>
