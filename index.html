<!DOCTYPE html>
<html>
<head>
<title>Love Game 💖</title>
<style>
body { text-align:center; background:pink; color:white; font-family:Arial; }

.screen { display:none; }
.active { display:block; }

button {
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:20px;
}

img { width:150px; }
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1" class="screen active">
  <h1>Happy Birthday ❤️</h1>
  <p>Are you ready?</p>
  <button onclick="next(2)">Yes 💖</button>
  <button onmouseover="move(this)">No 😜</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen">
  <h2>Click Door 🚪</h2>
  <img src="walk.png"><br>
  <button onclick="next(3)">Open Door</button>
</div>

<!-- SCREEN 3 GAME -->
<div id="screen3" class="screen">
  <h2>Fight with Stitch 🧸</h2>
  <p>Stitch Health: <span id="hp">100</span></p>
  <button onclick="attack()">Attack 👊</button>
</div>

<!-- SCREEN 4 -->
<div id="screen4" class="screen">
  <h1>❤️ I AM YOUR FAVORITE ❤️</h1>
</div>

<script>
let health = 100;

function next(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen'+n).classList.add('active');
}

function move(btn){
  btn.style.position='absolute';
  btn.style.left=Math.random()*300+'px';
}

function attack(){
  health -= 20;
  document.getElementById('hp').innerText = health;

  if(health <= 0){
    next(4);
  }
}
</script>

</body>
</html>
