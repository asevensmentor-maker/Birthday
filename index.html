<!DOCTYPE html>
<html>
<head>
<title>Love Fight Game 💖</title>

<style>
body {
  background: linear-gradient(to right, #ff758c, #ff7eb3);
  color:white;
  text-align:center;
  font-family: Arial;
}

/* SCREENS */
.screen { display:none; }
.active { display:block; }

/* GAME AREA */
.game {
  display:flex;
  justify-content:space-around;
  align-items:center;
  margin-top:50px;
}

/* CHARACTERS */
.character {
  width:160px;
  transition: all 0.3s ease;
  position: relative;
}

/* MOVE CLOSE */
.attack-move-left {
  transform: translateX(120px);
}

.attack-move-right {
  transform: translateX(-120px);
}

/* HIT EFFECT */
.hit {
  transform: scale(0.9);
}

/* HEALTH BAR */
.bar {
  width:150px;
  height:15px;
  background:white;
  border-radius:10px;
  margin:10px auto;
}

.hp {
  height:100%;
  background:red;
  border-radius:10px;
}

/* BUTTON */
button {
  padding:10px 20px;
  border:none;
  border-radius:20px;
  margin:10px;
}
</style>

</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1" class="active">
  <h1>Happy Birthday ❤️</h1>
  <button onclick="go(2)">Start 💖</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen">
  <h2>Fight Begins 🎮</h2>

  <div class="game">

    <!-- YOU -->
    <div>
      <img id="you" src="avatar.png" class="character">
      <div class="bar"><div id="youHP" class="hp" style="width:100%"></div></div>
    </div>

    <!-- STITCH -->
    <div>
      <img id="stitch" src="stitch.png" class="character">
      <div class="bar"><div id="stitchHP" class="hp" style="width:100%"></div></div>
    </div>

  </div>

  <button onclick="attack()">Attack 👊</button>
</div>

<!-- WIN -->
<div id="screen3" class="screen">
  <h1>❤️ I AM YOUR FAVORITE ❤️</h1>
</div>

<script>

function go(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen'+n).classList.add('active');
}

let you = 100;
let stitch = 100;

function update(){
  document.getElementById("youHP").style.width = you + "%";
  document.getElementById("stitchHP").style.width = stitch + "%";
}

function attack(){

  const youChar = document.getElementById("you");
  const stitchChar = document.getElementById("stitch");

  // MOVE CLOSE
  youChar.classList.add("attack-move-left");
  stitchChar.classList.add("attack-move-right");

  // HIT EFFECT
  stitchChar.classList.add("hit");

  setTimeout(()=>{
    youChar.classList.remove("attack-move-left");
    stitchChar.classList.remove("attack-move-right");
    stitchChar.classList.remove("hit");
  },300);

  // DAMAGE
  stitch -= 20;
  update();

  if(stitch <= 0){
    go(3);
  }
}

</script>

</body>
</html>
