<!DOCTYPE html>
<html>
<head>
<title>Love Game 💖</title>
<style>
body { font-family: Arial; text-align:center; background:pink; color:white; }

.screen { display:none; }
.active { display:block; }

button {
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1" class="screen active">
  <h1>Happy Birthday ❤️</h1>
  <p>Are you ready for your surprise?</p>
  <button onclick="startGame()">Yes 💖</button>
  <button onmouseover="moveBtn(this)">No 😜</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen">
  <h2>🚪 Click the door</h2>
  <img src="walk.png" width="200"><br>
  <button onclick="openDoor()">Open Door 🚪</button>
</div>

<!-- SCREEN 3 -->
<div id="screen3" class="screen">
  <h2>You met Stitch 🧸</h2>
  <p>Fight to prove you're her favorite!</p>
  
  <p>Stitch Health: <span id="health">100</span></p>
  
  <button onclick="attack()">Attack 👊</button>
</div>

<!-- SCREEN 4 -->
<div id="screen4" class="screen">
  <h1>❤️ I am your favorite ❤️</h1>
  <p>But you are my whole world 💖</p>
</div>

<script>

function startGame(){
  showScreen(2);
}

function openDoor(){
  showScreen(3);
}

function moveBtn(btn){
  btn.style.position='absolute';
  btn.style.left=Math.random()*300+'px';
}

let health = 100;

function attack(){
  health -= 20;
  document.getElementById("health").innerText = health;

  if(health <= 0){
    showScreen(4);
  }
}

function showScreen(num){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen'+num).classList.add('active');
}

</script>

</body>
</html>
